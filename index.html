<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moonbyul - Floating Dock Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Fira+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="site-content-scaled">
    <!-- Floating Dock Overlay -->
    <nav class="left-dock" id="leftDock">
      <button class="hide-dock-btn" id="hideDockBtn" title="Hide Dock">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <a href="#about" class="icon-link" title="About">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
      </a>
      <a href="#projects" class="icon-link" title="Projects">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0M12 12.75h.008v.008H12v-.008Z" />
        </svg>
      </a>
      <a href="#contact" class="icon-link" title="Contact">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
        </svg>
      </a>
    </nav>
    <!-- Show Button -->
    <button class="show-dock-btn" id="showDockBtn" title="Show Dock">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
           xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 6 15 12 9 18"/>
      </svg>
    </button>

    <div class="main-content" id="mainContent">
      <section id="about">
        <!-- Animated SVG Floating Vector -->
        <!-- Place this inside your <section id="about">, above .about-hero -->

        <div class="about-hero">
          <div class="about-text">
            <span class="about-intro">Hi, my name is</span>
            <h1 class="about-name">
              <span>M</span><span>O</span><span>O</span><span>N</span><span>B</span><span>Y</span><span>U</span><span>L</span><span>!</span>
            </h1>
            <div class="about-title">
              Software Developer passionate about web technologies, UI/UX, and building delightful user experiences.
            </div>
            <a href="#contact" class="about-btn">GET IN TOUCH</a>
          </div>
          <div class="about-image">
            <div class="flip-card">
              <div class="flip-card-inner">
                <div class="flip-card-front">
                  <img src="images/about-me-front.jpg" alt="Moonbyul Front" />
                </div>
                <div class="flip-card-back">
                  <img src="images/about-me-back.jpg" alt="Moonbyul Back" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="projects">
        <h2>Projects</h2>
      </section>

      <section id="contact">
        <h2>Contact</h2>
      </section>
    </div>
  </div>

  <script>
    // Hide/show dock logic
    const dock = document.getElementById('leftDock');
    const hideBtn = document.getElementById('hideDockBtn');
    const showBtn = document.getElementById('showDockBtn');
    hideBtn.onclick = () => {
      dock.classList.add('hidden');
      showBtn.classList.add('visible');
      showBtn.style.top = dock.style.top || "100px";
    };
    showBtn.onclick = () => {
      dock.classList.remove('hidden');
      showBtn.classList.remove('visible');
    };
    // Make the whole dock draggable (except on buttons/links)
    let isDragging = false;
    let offsetY = 0;
    dock.addEventListener('mousedown', function(e) {
      if (
        e.target.closest('button') ||
        e.target.closest('a')
      ) return;
      isDragging = true;
      offsetY = e.clientY - dock.getBoundingClientRect().top;
      document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      let newTop = e.clientY - offsetY;
      const minTop = 0;
      const maxTop = window.innerHeight - dock.offsetHeight;
      newTop = Math.max(minTop, Math.min(maxTop, newTop));
      dock.style.top = newTop + 'px';
      if (dock.classList.contains('hidden')) {
        showBtn.style.top = newTop + 'px';
      }
    });
    document.addEventListener('mouseup', function() {
      isDragging = false;
      document.body.style.userSelect = '';
    });
    // Touch support
    dock.addEventListener('touchstart', function(e) {
      if (
        e.target.closest('button') ||
        e.target.closest('a')
      ) return;
      isDragging = true;
      offsetY = e.touches[0].clientY - dock.getBoundingClientRect().top;
    });
    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      let newTop = e.touches[0].clientY - offsetY;
      const minTop = 0;
      const maxTop = window.innerHeight - dock.offsetHeight;
      newTop = Math.max(minTop, Math.min(maxTop, newTop));
      dock.style.top = newTop + 'px';
      if (dock.classList.contains('hidden')) {
        showBtn.style.top = newTop + 'px';
      }
    });
    document.addEventListener('touchend', function() {
      isDragging = false;
    });
  </script>
</body>
</html>
